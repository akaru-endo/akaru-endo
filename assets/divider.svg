<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" width="1000" height="80">
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#8b949e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8b949e" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8b949e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#8b949e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8b949e" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8b949e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 中央ライン -->
  <rect y="39.5" width="1000" height="1" fill="url(#line)"/>

  <!-- 左から右へ流れる光 -->
  <rect y="0" width="180" height="80" fill="url(#scan)">
    <animate attributeName="x" from="-180" to="1000" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- 漂うパーティクル -->
  <g fill="#8b949e">
    <circle cx="90"  cy="60" r="1.6"><animate attributeName="cy" values="64;12;64" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="20" r="1.2"><animate attributeName="cy" values="10;68;10" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="55" r="2"><animate attributeName="cy" values="66;14;66" dur="6s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="390" cy="30" r="1.3"><animate attributeName="cy" values="12;66;12" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="62" r="1.8"><animate attributeName="cy" values="68;10;68" dur="5.5s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="5.5s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="18" r="1.2"><animate attributeName="cy" values="12;68;12" dur="6.5s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6.5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="710" cy="58" r="2"><animate attributeName="cy" values="66;12;66" dur="7s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="810" cy="26" r="1.4"><animate attributeName="cy" values="10;66;10" dur="5s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="5s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="910" cy="52" r="1.7"><animate attributeName="cy" values="64;14;64" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/></circle>
  </g>
</svg>
