<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 296" width="560" height="296">
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .grey{fill:#8b949e}
    .white{fill:#f0f6fc}
    .yel{fill:#EAFF00}
  </style>

  <rect x="1" y="1" width="558" height="294" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- 名前 -->
  <text class="sans white" x="40" y="66" font-size="44" font-weight="700">Akaru Endo</text>
  <rect x="40" y="78" width="56" height="4" rx="2" fill="#EAFF00"/>
  <text class="sans grey" x="40" y="108" font-size="17">Kosen student · aiming for NLP research</text>

  <line x1="40" y1="128" x2="520" y2="128" stroke="#30363d"/>

  <!-- プロンプト -->
  <text class="mono white" x="40" y="162" font-size="20"><tspan fill="#EAFF00">&gt;</tspan> I want to study <tspan fill="#EAFF00">█<animate attributeName="fill" values="#EAFF00;#0d1117" keyTimes="0;.5" calcMode="discrete" dur="1s" repeatCount="indefinite"/></tspan></text>
  <text class="mono grey" x="520" y="162" font-size="14" text-anchor="end">P(next token)</text>

  <!-- 次トークン候補 -->
  <!-- 1位：NLP -->
  <text class="mono yel" x="40" y="198" font-size="17" font-weight="700" dominant-baseline="central">NLP</text>
  <rect x="120" y="191" width="320" height="14" rx="7" fill="#21262d"/>
  <rect x="120" y="191" width="198" height="14" rx="7" fill="#EAFF00">
    <animate attributeName="width" values="0;198;198;0" keyTimes="0;.25;.9;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text class="mono yel" x="520" y="198" font-size="16" font-weight="700" text-anchor="end" dominant-baseline="central">62%</text>

  <!-- 2位：LLM -->
  <text class="mono white" x="40" y="232" font-size="17" dominant-baseline="central">LLM</text>
  <rect x="120" y="225" width="320" height="14" rx="7" fill="#21262d"/>
  <rect x="120" y="225" width="67" height="14" rx="7" fill="#6e7681">
    <animate attributeName="width" values="0;67;67;0" keyTimes="0;.25;.9;1" dur="6s" begin=".2s" repeatCount="indefinite"/>
  </rect>
  <text class="mono grey" x="520" y="232" font-size="16" text-anchor="end" dominant-baseline="central">21%</text>

  <!-- 3位：Math -->
  <text class="mono white" x="40" y="266" font-size="17" dominant-baseline="central">Math</text>
  <rect x="120" y="259" width="320" height="14" rx="7" fill="#21262d"/>
  <rect x="120" y="259" width="35" height="14" rx="7" fill="#6e7681">
    <animate attributeName="width" values="0;35;35;0" keyTimes="0;.25;.9;1" dur="6s" begin=".4s" repeatCount="indefinite"/>
  </rect>
  <text class="mono grey" x="520" y="266" font-size="16" text-anchor="end" dominant-baseline="central">11%</text>
</svg>
