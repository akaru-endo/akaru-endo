<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="600" height="230">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#24292f;font-size:16px}
    @media (prefers-color-scheme: dark){text{fill:#e6edf3}}
    .dim{fill:#8b949e;font-size:13px}
    .acc{fill:#58a6ff}
    .tk{fill:none;stroke:#8b949e;stroke-opacity:.7}
    .hot{stroke:#58a6ff;stroke-opacity:.95}
    .arc{fill:none;stroke:#58a6ff;stroke-linecap:round}
  </style>

  <text class="dim" x="52" y="28">self-attention</text>
  <text class="dim" x="548" y="28" text-anchor="end">softmax(QK^T/√d) V</text>

  <!-- 注意の弧（太いほど重みが大きい） -->
  <path class="arc" stroke-width="3" d="M498,150 Q401,70 304,150">
    <animate attributeName="stroke-opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/>
  </path>
  <path class="arc" stroke-width="2" d="M498,150 Q450,105 401,150">
    <animate attributeName="stroke-opacity" values=".3;1;.3" dur="3s" begin=".4s" repeatCount="indefinite"/>
  </path>
  <path class="arc" stroke-width="1.4" d="M498,150 Q318,-10 139,150">
    <animate attributeName="stroke-opacity" values=".2;.8;.2" dur="3s" begin=".8s" repeatCount="indefinite"/>
  </path>
  <path class="arc" stroke-width="1" d="M498,150 Q285,-30 72,150">
    <animate attributeName="stroke-opacity" values=".15;.6;.15" dur="3s" begin="1.2s" repeatCount="indefinite"/>
  </path>

  <!-- 信号 -->
  <circle r="3.5" fill="#58a6ff">
    <animateMotion dur="3s" repeatCount="indefinite" path="M498,150 Q401,70 304,150"/>
  </circle>

  <!-- トークン -->
  <rect class="tk" x="52"  y="150" width="40"  height="36" rx="8"/><text x="72"  y="168" text-anchor="middle" dominant-baseline="central">I</text>
  <rect class="tk" x="104" y="150" width="70"  height="36" rx="8"/><text x="139" y="168" text-anchor="middle" dominant-baseline="central">study</text>
  <rect class="tk" x="186" y="150" width="56"  height="36" rx="8"/><text x="214" y="168" text-anchor="middle" dominant-baseline="central">how</text>
  <rect class="tk" x="254" y="150" width="100" height="36" rx="8"/><text x="304" y="168" text-anchor="middle" dominant-baseline="central">machines</text>
  <rect class="tk" x="366" y="150" width="70"  height="36" rx="8"/><text x="401" y="168" text-anchor="middle" dominant-baseline="central">read</text>
  <rect class="tk hot" x="448" y="150" width="100" height="36" rx="8"/><text x="498" y="168" text-anchor="middle" dominant-baseline="central">language</text>

  <!-- 出力 -->
  <text class="acc" x="52" y="215">→ Natural Language Processing</text>
  <rect class="acc" x="340" y="202" width="9" height="18">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
