<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#24292f;font-size:15px}
    @media (prefers-color-scheme: dark){text{fill:#e6edf3}}
    .dim{fill:#8b949e;font-size:13px}
    .n{fill:none;stroke:#8b949e;stroke-opacity:.75}
    .hot{stroke:#58a6ff;stroke-opacity:.95}
    .e{stroke:#8b949e;stroke-opacity:.2}
    .h{stroke:#8b949e;stroke-opacity:.55}
  </style>

  <text class="dim" x="90"  y="34" text-anchor="middle">LANGUAGES</text>
  <text class="dim" x="300" y="34" text-anchor="middle">DATA &amp; ML</text>
  <text class="dim" x="520" y="34" text-anchor="middle">GOAL</text>

  <!-- 入力層 → 隠れ層 -->
  <g>
    <line class="e" x1="150" y1="90"  x2="240" y2="90"/><line class="e" x1="150" y1="90"  x2="240" y2="160"/><line class="e" x1="150" y1="90"  x2="240" y2="230"/><line class="e" x1="150" y1="90"  x2="240" y2="300"/>
    <line class="h" x1="150" y1="160" x2="240" y2="90"/><line class="h" x1="150" y1="160" x2="240" y2="160"/><line class="h" x1="150" y1="160" x2="240" y2="230"/><line class="h" x1="150" y1="160" x2="240" y2="300"/>
    <line class="e" x1="150" y1="230" x2="240" y2="90"/><line class="e" x1="150" y1="230" x2="240" y2="160"/><line class="e" x1="150" y1="230" x2="240" y2="230"/><line class="e" x1="150" y1="230" x2="240" y2="300"/>
    <line class="e" x1="150" y1="300" x2="240" y2="90"/><line class="e" x1="150" y1="300" x2="240" y2="160"/><line class="e" x1="150" y1="300" x2="240" y2="230"/><line class="e" x1="150" y1="300" x2="240" y2="300"/>
  </g>

  <!-- 隠れ層 → 出力 -->
  <g>
    <line class="h" x1="360" y1="90"  x2="477" y2="195"/>
    <line class="h" x1="360" y1="160" x2="477" y2="195"/>
    <line class="h" x1="360" y1="230" x2="477" y2="195"/>
    <line class="h" x1="360" y1="300" x2="477" y2="195"/>
  </g>

  <!-- 信号 -->
  <g fill="#58a6ff">
    <circle r="3"><animateMotion dur="2s" repeatCount="indefinite" path="M150,160 L240,300"/></circle>
    <circle r="3"><animateMotion dur="2.4s" begin=".6s" repeatCount="indefinite" path="M150,160 L240,90"/></circle>
    <circle r="3"><animateMotion dur="2.2s" begin="1s" repeatCount="indefinite" path="M150,90 L240,160"/></circle>
    <circle r="3"><animateMotion dur="2.6s" begin="1.4s" repeatCount="indefinite" path="M150,300 L240,230"/></circle>
    <circle r="3"><animateMotion dur="2s" repeatCount="indefinite" path="M360,160 L477,195"/></circle>
    <circle r="3"><animateMotion dur="2.3s" begin=".5s" repeatCount="indefinite" path="M360,300 L477,195"/></circle>
    <circle r="3"><animateMotion dur="2.1s" begin="1s" repeatCount="indefinite" path="M360,90 L477,195"/></circle>
    <circle r="3"><animateMotion dur="2.5s" begin="1.5s" repeatCount="indefinite" path="M360,230 L477,195"/></circle>
  </g>

  <!-- 入力層ノード -->
  <rect class="n" x="30" y="73"  width="120" height="34" rx="17"/><text x="90" y="90"  text-anchor="middle" dominant-baseline="central">C</text>
  <rect class="n hot" x="30" y="143" width="120" height="34" rx="17"/><text x="90" y="160" text-anchor="middle" dominant-baseline="central">Python</text>
  <rect class="n" x="30" y="213" width="120" height="34" rx="17"/><text x="90" y="230" text-anchor="middle" dominant-baseline="central">Java</text>
  <rect class="n" x="30" y="283" width="120" height="34" rx="17"/><text x="90" y="300" text-anchor="middle" dominant-baseline="central">HTML/CSS/JS</text>

  <!-- 隠れ層ノード -->
  <rect class="n" x="240" y="73"  width="120" height="34" rx="17"/><text x="300" y="90"  text-anchor="middle" dominant-baseline="central">NumPy</text>
  <rect class="n" x="240" y="143" width="120" height="34" rx="17"/><text x="300" y="160" text-anchor="middle" dominant-baseline="central">pandas</text>
  <rect class="n" x="240" y="213" width="120" height="34" rx="17"/><text x="300" y="230" text-anchor="middle" dominant-baseline="central">scikit-learn</text>
  <rect class="n hot" x="240" y="283" width="120" height="34" rx="17"/><text x="300" y="300" text-anchor="middle" dominant-baseline="central">PyTorch</text>

  <!-- 出力ノード -->
  <circle cx="520" cy="195" r="44" fill="none" stroke="#58a6ff" stroke-opacity="0">
    <animate attributeName="r" values="44;62" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values=".6;0" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="195" r="44" fill="#58a6ff" fill-opacity=".1" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="520" y="195" text-anchor="middle" dominant-baseline="central" style="font-size:22px;font-weight:700">NLP</text>

  <!-- 環境 -->
  <line class="e" x1="40" y1="338" x2="560" y2="338"/>
  <text class="dim" x="300" y="360" text-anchor="middle">TOOLS</text>
  <text x="300" y="382" text-anchor="middle" style="font-size:14px">Jupyter · Colab · Kaggle · VS Code · PyCharm · Git</text>
</svg>
